[workspace]
members = [
    "crates/office2pdf",
    "crates/office2pdf-cli",
    "crates/ooxml-package",
    "crates/pptx-model",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/developer0hye/office2pdf"

[patch.crates-io]
umya-spreadsheet = { git = "https://github.com/developer0hye/umya-spreadsheet.git", branch = "fix/panic-safety-v2" }
# Retain parser fixes; source crops are read from raw XML, independent of this pin.
docx-rs = { git = "https://github.com/developer0hye/docx-rs.git", rev = "78e3e9bff63349a075e0e26a196a1f24d86f43e9" }
# Retain the stable-version compiler fix (#816) and backport upstream 2e540da3:
# separate progressive DC scans must select their declared Huffman table.
# Replace this pin when a compatible stable release includes both fixes.
# Both crates need the same source to keep image's ZByteReaderTrait identity.
zune-jpeg = { git = "https://github.com/developer0hye/zune-image", rev = "f256e946a0017d1577e7da553281108e4038452b" }
zune-core = { git = "https://github.com/developer0hye/zune-image", rev = "f256e946a0017d1577e7da553281108e4038452b" }

# CI test profile. The suite is bound by executing unoptimized dependencies
# (Typst layout, font parsing, inflate), not by compiling them: optimizing only
# the dependencies cut the Windows test run from 17.5 to 3.2 minutes while the
# workspace crates, which change every PR, stay fast to rebuild. Debug
# assertions and overflow checks remain on.
[profile.ci]
inherits = "dev"
debug = "line-tables-only"

[profile.ci.package."*"]
opt-level = 2
debug = false
