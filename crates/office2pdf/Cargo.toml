[package]
name = "office2pdf"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Convert DOCX, XLSX, and PPTX files to PDF using pure Rust"
readme = "../../README.md"
keywords = ["pdf", "docx", "xlsx", "pptx", "converter"]
categories = ["text-processing"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["embedded-fonts"]
embedded-fonts = ["typst-kit/embedded-fonts"]
wasm = ["wasm-bindgen"]
wasm-cjk-font = ["wasm"]
pdf-ops = ["lopdf"]
typescript = ["ts-rs"]

[dependencies]
thiserror = "2"
lopdf = { version = "0.45", optional = true }
typst = "0.15"
typst-pdf = "0.15"
# `PagedDocument` is no longer re-exported through `typst` since 0.15.
typst-layout = "0.15"
typst-kit = { version = "0.15", default-features = false, features = [
    "scan-fonts",
] }
comemo = "0.5"
# Already in the tree through typst; declared directly because a face's own
# `name` table is not reachable through typst's public API without building a
# rustybuzz face, which the family-refiling pass must not pay for every
# installed font (issue #1837).
ttf-parser = "0.25"
# Published forks carrying reader fixes upstream has not released; a
# [patch.crates-io] entry would not reach crates.io users (RELEASING.md).
docx-rs = { package = "office2pdf-docx-rs", version = "0.2.0" }
serde = "1"
serde_json = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
# Real-world HTML imports are not XML; Servo handles omitted closing tags and
# entities. RcDom is used only as a local, read-only tree during import.
html5ever = "0.39"
markup5ever_rcdom = "0.39"
# MHTML requires MIME header unfolding, transfer decoding and charset handling.
mailparse = "0.18"
umya-spreadsheet = { package = "office2pdf-umya-spreadsheet", version = "0.2.0" }
unicode-normalization = "0.1"
image = "0.25"
# Access partial frames when damaged DOCX pictures cannot be fully decoded.
png = "0.18"
tracing = "0.1"
wasm-bindgen = { version = "0.2", optional = true }
ts-rs = { version = "12", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browsers cannot discover system fonts; preserve their built-in fallback set.
typst-kit = { version = "0.15", default-features = false, features = ["embedded-fonts"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
# `std::time::{Instant, SystemTime}` panic with "time not implemented on this
# platform" on wasm32-unknown-unknown. web-time shims them via the browser
# clock and re-exports std on every other target. Kept out of the `wasm`
# feature so a no-feature wasm32 build (CI `wasm-check` step 1) still compiles.
web-time = "1.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies]
paste = "1"
pdf-extract = "0.10"

# criterion pulls rayon, which fails to compile for wasm32. Keep the benchmark
# harness off wasm targets so `wasm-pack test` (which builds all dev-deps) can
# build and run the wasm integration tests in src/wasm.rs.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "conversion"
harness = false
