[package]
name = "office2pdf"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Convert DOCX, XLSX, and PPTX files to PDF using pure Rust"
readme = "../../README.md"
keywords = ["pdf", "docx", "xlsx", "pptx", "converter"]
categories = ["text-processing"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["embedded-fonts"]
embedded-fonts = ["typst-kit/embedded-fonts"]
wasm = ["wasm-bindgen"]
wasm-cjk-font = ["wasm"]
pdf-ops = ["lopdf"]
typescript = ["ts-rs"]

[dependencies]
thiserror = "2"
lopdf = { version = "0.45", optional = true }
typst = "0.15"
typst-pdf = "0.15"
# `PagedDocument` is no longer re-exported through `typst` since 0.15.
typst-layout = "0.15"
typst-kit = { version = "0.15", default-features = false, features = [
    "scan-fonts",
] }
comemo = "0.5"
docx-rs = "0.4.22"
serde = "1"
serde_json = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
umya-spreadsheet = "2"
unicode-normalization = "0.1"
image = "0.25"
tracing = "0.1"
wasm-bindgen = { version = "0.2", optional = true }
ts-rs = { version = "12", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browsers cannot discover system fonts; preserve their built-in fallback set.
typst-kit = { version = "0.15", default-features = false, features = ["embedded-fonts"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
# `std::time::{Instant, SystemTime}` panic with "time not implemented on this
# platform" on wasm32-unknown-unknown. web-time shims them via the browser
# clock and re-exports std on every other target. Kept out of the `wasm`
# feature so a no-feature wasm32 build (CI `wasm-check` step 1) still compiles.
web-time = "1.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies]
paste = "1"
pdf-extract = "0.10"

# criterion pulls rayon, which fails to compile for wasm32. Keep the benchmark
# harness off wasm targets so `wasm-pack test` (which builds all dev-deps) can
# build and run the wasm integration tests in src/wasm.rs.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "conversion"
harness = false
