name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-verification:
    name: Publish Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the packaged library builds without workspace patches
        # cargo publish verifies the packaged tarball against the crates.io
        # dependency graph, where [patch.crates-io] does not apply. Reading a
        # patched fork's API compiles everywhere else and then fails only in
        # the release run's publish job, which is how v0.6.6 shipped binaries
        # but no crates (issue #1041). The CLI cannot be dry-run verified here:
        # it depends on the library version being published first.
        # Library consumers also ignore the published Cargo.lock, so remove the
        # workspace lock in this disposable checkout before resolving their graph.
        run: |
          rm Cargo.lock
          cargo publish --dry-run -p office2pdf --allow-dirty
  release-contract:
    name: Release Automation Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release preparation contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/release/prepare-release.sh

          if grep -Eq '^  release:' .github/workflows/release.yml; then
            echo "::error::release.published would duplicate a workflow_dispatch release"
            exit 1
          fi

          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "office2pdf") | .version')"

          GH_CLI_BIN=true \
          RELEASE_TAG="v${version}" \
          GITHUB_EVENT_NAME=workflow_dispatch \
          GITHUB_REF_NAME=main \
          DEFAULT_BRANCH=main \
          GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
          bash scripts/release/prepare-release.sh

          if GH_CLI_BIN=true \
            RELEASE_TAG="${version}" \
            GITHUB_EVENT_NAME=workflow_dispatch \
            GITHUB_REF_NAME=main \
            DEFAULT_BRANCH=main \
            GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            bash scripts/release/prepare-release.sh; then
            echo "::error::A tag without the v prefix was accepted"
            exit 1
          fi

          if GH_CLI_BIN=true \
            RELEASE_TAG="v${version}" \
            GITHUB_EVENT_NAME=workflow_dispatch \
            GITHUB_REF_NAME=feature \
            DEFAULT_BRANCH=main \
            GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            bash scripts/release/prepare-release.sh; then
            echo "::error::A new release from a non-default branch was accepted"
            exit 1
          fi

      - name: Validate dependency lock contract
        run: python3 -m unittest scripts.tests.test_dependency_lock_contract

  business-golden-contract:
    name: Business Golden Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Test business golden validator
        run: python3 -m unittest discover -s scripts/tests -p 'test_validate_business_golden_mocks.py'
      - name: Test layout baseline producer
        run: python3 -m unittest discover -s scripts/tests -p 'test_generate_layout_baselines.py'
      - name: Test layout baseline consumer
        run: python3 -m unittest discover -s scripts/tests -p 'test_check_layout_baselines.py'
      - name: Test native golden export staging
        run: python3 -m unittest discover -s scripts/tests -p 'test_export_business_golden_pdfs.py'
      - name: Validate business golden corpus
        run: python3 scripts/validate_business_golden_mocks.py

  visual-pr-contract:
    name: Visual PR Contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Test visual PR validator
        run: python3 -m unittest discover -s scripts/tests -p 'test_check_visual_pr.py'
      - name: Test layout differ
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_compare_layout.py'
          python3 -m unittest discover -s scripts/tests -p 'test_spatial_match.py'
      - name: Test render comparison
        run: python3 -m unittest discover -s scripts/tests -p 'test_compare_render.py'
      - name: Test text-layer census
        run: python3 -m unittest discover -s scripts/tests -p 'test_compare_text_layer.py'
      - name: Test GT integrity gate
        run: python3 -m unittest discover -s scripts/tests -p 'test_check_gt_integrity.py'
      - name: Test probe harness
        run: python3 -m unittest discover -s scripts/tests -p 'test_probe_harness.py'
      - name: Test PowerPoint chart-axis harness
        run: python3 -m unittest discover -s scripts/tests -p 'test_measure_powerpoint_chart_axis.py'
      - name: Test Excel row-height sweep
        run: python3 -m unittest discover -s scripts/tests -p 'test_measure_excel_row_height.py'
      - name: Test issue-loop viewer
        run: python3 -m unittest discover -s scripts/tests -p 'test_issue_loop_watch.py'
      - name: Check issue-loop script syntax
        run: bash -n scripts/issue_loop.sh
      - name: Validate visual PR contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/check_visual_pr.py
          --event "${GITHUB_EVENT_PATH}"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --repository "${{ github.repository }}"

  check:
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, "1.89"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # No fixture fetch: every fixture the default suite reads is tracked in git.
      # Only the #[ignore]d bulk gate needs the full corpus, and it runs in bulk-test.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install qpdf
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - run: cargo test --locked --workspace
        env:
          OFFICE2PDF_VALIDATE_PDF: "1"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  wasm-check:
    name: WASM Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - run: cargo check --locked --target wasm32-unknown-unknown -p office2pdf
      - run: cargo check --locked --target wasm32-unknown-unknown -p office2pdf --features wasm
      - run: cargo check --locked --target wasm32-unknown-unknown -p office2pdf --features wasm-cjk-font
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # `cargo check` and `wasm-pack test` do not link the browser package
      # documented in README.md, so keep that artifact buildable too.
      - name: Build browser package
        run: wasm-pack build crates/office2pdf --target web --features wasm --locked
      # Runs the wasm integration tests in src/wasm.rs under Node, exercising
      # the wasm32 time paths (Instant/SystemTime) end-to-end so the issue #178
      # class of runtime panic cannot regress unnoticed.
      - name: Run wasm tests in Node
        working-directory: crates/office2pdf
        run: wasm-pack test --node --features wasm --locked
      - name: Build browser package with bundled Chinese font
        run: wasm-pack build crates/office2pdf --target web --features wasm-cjk-font --locked
      - name: Run bundled Chinese font tests in Node
        working-directory: crates/office2pdf
        run: wasm-pack test --node --features wasm-cjk-font --locked

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  bulk-test:
    name: Bulk Third-Party Fixture Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bulk-fixtures
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compare fixture outcomes with baseline
        run: cargo test --locked --release -p office2pdf --test bulk_conversion test_bulk_regression_gate -- --ignored --nocapture --exact
        env:
          BULK_REPORT_DIR: ${{ runner.temp }}/bulk-conversion
      - name: Upload bulk conversion reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulk-conversion-report
          path: ${{ runner.temp }}/bulk-conversion
          if-no-files-found: warn
