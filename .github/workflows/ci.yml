name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is deliberately absent: only the PR body contract reads the body,
    # and it lives in pr-contract.yml so a description edit does not re-run
    # every Rust job on an unchanged head.
    types: [opened, synchronize, reopened]

# A new push to a PR supersedes its running checks. Pushes to main key on the
# commit, so every merge commit keeps its own complete run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Every rust-cache step saves only on main. The repository's Actions cache is
# capped at 10 GB; when each PR also saved its own ~1 GB entries, they evicted
# main's and most jobs restored nothing. PRs restore main's entries instead.
# Jobs whose dependency graphs match share one entry for the same reason.

permissions:
  contents: read

jobs:
  changes:
    # A PR touching only `.md` files, `assets/` or `references/` skips the Rust
    # jobs (AGENTS.md, Testing). Pushes to main always build everything so each
    # merge commit gets a full run. A skipped job reports success, so nothing
    # waits on a pending check.
    name: Detect Rust-relevant changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - id: filter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "rust=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "${RUNNER_TEMP}/changed.txt"
          # No Rust code reads Markdown, bug-fix evidence, validation notes or
          # reference summaries at runtime. The Python contract jobs, which do
          # read README.md and AGENTS.md, are not gated.
          if grep -qvE '\.md$|^assets/|^references/' "${RUNNER_TEMP}/changed.txt"; then
            echo "rust=true" >> "${GITHUB_OUTPUT}"
          else
            echo "rust=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Only documentation or evidence changed; Rust jobs skipped"
          fi

  publish-verification:
    name: Publish Verification
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the packaged library builds without workspace patches
        # cargo publish verifies the packaged tarball against the crates.io
        # dependency graph, where [patch.crates-io] does not apply. Reading a
        # patched fork's API compiles everywhere else and then fails only in
        # the release run's publish job, which is how v0.6.6 shipped binaries
        # but no crates (issue #1041). The CLI cannot be dry-run verified here:
        # it depends on the library version being published first.
        # Library consumers also ignore the published Cargo.lock, so remove the
        # workspace lock in this disposable checkout before resolving their graph.
        run: |
          rm Cargo.lock
          cargo publish --dry-run -p office2pdf --allow-dirty
  release-contract:
    name: Release Automation Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release preparation contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/release/prepare-release.sh

          if grep -Eq '^  release:' .github/workflows/release.yml; then
            echo "::error::release.published would duplicate a workflow_dispatch release"
            exit 1
          fi

          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "office2pdf") | .version')"

          GH_CLI_BIN=true \
          RELEASE_TAG="v${version}" \
          GITHUB_EVENT_NAME=workflow_dispatch \
          GITHUB_REF_NAME=main \
          DEFAULT_BRANCH=main \
          GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
          bash scripts/release/prepare-release.sh

          if GH_CLI_BIN=true \
            RELEASE_TAG="${version}" \
            GITHUB_EVENT_NAME=workflow_dispatch \
            GITHUB_REF_NAME=main \
            DEFAULT_BRANCH=main \
            GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            bash scripts/release/prepare-release.sh; then
            echo "::error::A tag without the v prefix was accepted"
            exit 1
          fi

          if GH_CLI_BIN=true \
            RELEASE_TAG="v${version}" \
            GITHUB_EVENT_NAME=workflow_dispatch \
            GITHUB_REF_NAME=feature \
            DEFAULT_BRANCH=main \
            GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            bash scripts/release/prepare-release.sh; then
            echo "::error::A new release from a non-default branch was accepted"
            exit 1
          fi

      - name: Validate dependency lock contract
        run: python3 -m unittest scripts.tests.test_dependency_lock_contract
      - name: Validate embedded font feature resolution
        run: python3 -m unittest scripts.tests.test_embedded_font_features

  business-golden-contract:
    name: Business Golden Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Test business golden validator
        run: python3 -m unittest discover -s scripts/tests -p 'test_validate_business_golden_mocks.py'
      - name: Test layout baseline producer
        run: python3 -m unittest discover -s scripts/tests -p 'test_generate_layout_baselines.py'
      - name: Test layout baseline consumer
        run: python3 -m unittest discover -s scripts/tests -p 'test_check_layout_baselines.py'
      - name: Test native golden export staging
        run: python3 -m unittest discover -s scripts/tests -p 'test_export_business_golden_pdfs.py'
      - name: Validate business golden corpus
        run: python3 scripts/validate_business_golden_mocks.py

  check:
    # Stable is already compiled per OS by Test (and on Linux by Clippy), so
    # only the MSRV needs a separate check.
    name: Check MSRV
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked --workspace

  test:
    name: Test (${{ matrix.os }}${{ matrix.part != 'all' && format(', {0}', matrix.part) || '' }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, part: all }
          - { os: macos-latest, part: all }
          # Windows spent 3.2 of its 5.8 min running the test binaries one
          # after another (lib 80s, xlsx 65s, pptx 34s), so its unit and
          # integration targets run as two legs. Examples, which a bare
          # `cargo test` also builds, stay covered by the Linux and macOS legs.
          - { os: windows-latest, part: units }
          - { os: windows-latest, part: integration }
    steps:
      # No fixture fetch: every fixture the default suite reads is tracked in git.
      # Only the #[ignore]d bulk gate needs the full corpus, and it runs in bulk-test.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache keys ignore the Cargo profile, so a key that already
          # held dev-profile dependencies would restore as a full match and
          # never save the optimized ones. The name marks the ci profile.
          shared-key: test-ci-profile
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install qpdf
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - name: Run tests
        shell: bash
        env:
          OFFICE2PDF_VALIDATE_PDF: "1"
        run: |
          case "${{ matrix.part }}" in
            all)
              cargo test --locked --workspace --profile ci ;;
            units)
              cargo test --locked --workspace --profile ci --lib --bins
              cargo test --locked --workspace --profile ci --doc ;;
            integration)
              # The quoted wildcard picks up every integration target,
              # including ones added later.
              cargo test --locked --workspace --profile ci --test '*' ;;
          esac

  issue-2019-visual-audit:
    name: "Export #2019 visual audit PDF"
    needs: changes
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/issue-2019-textbox-baseline' && needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-ci-profile
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run focused issue 2019 baseline regression
        id: issue-2019-test
        continue-on-error: true
        run: cargo test --locked -p office2pdf --profile ci --lib anchored_text_box_quote_uses_the_word_left_cell_seat
      - name: Export PDF for the full-page audit
        if: always()
        run: cargo run --locked --profile ci -p office2pdf-cli -- tests/fixtures/docx/libreoffice/tdf105688.docx --output "${RUNNER_TEMP}/issue-2019-after.pdf"
      - name: Upload PDF for the full-page audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-2019-after-pdf
          path: ${{ runner.temp }}/issue-2019-after.pdf
          if-no-files-found: error
      - name: Preserve the PR head converter for a font-matched audit
        if: always()
        run: cp target/ci/office2pdf "${RUNNER_TEMP}/issue-2019-head"
      - uses: actions/checkout@v4
        if: always()
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: issue-2019-base
      - name: Build the PR base converter for a font-matched audit
        if: always()
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo build --locked --profile ci --manifest-path issue-2019-base/Cargo.toml -p office2pdf-cli
      - name: Preserve the PR base converter for a font-matched audit
        if: always()
        run: cp target/ci/office2pdf "${RUNNER_TEMP}/issue-2019-base"
      - name: Upload the PR head converter for a font-matched audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-2019-head-converter
          path: ${{ runner.temp }}/issue-2019-head
          if-no-files-found: error
          retention-days: 1
      - name: Upload the PR base converter for a font-matched audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-2019-base-converter
          path: ${{ runner.temp }}/issue-2019-base
          if-no-files-found: error
          retention-days: 1
      - name: Require focused issue 2019 baseline regression to pass
        if: always()
        run: test "${{ steps.issue-2019-test.outcome }}" = "success"

  no-embedded-fonts:
    # A different feature set rebuilds the crate, so it runs beside Test
    # instead of extending Test's critical path.
    name: Test without Typst fonts
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Unlike Test's workspace build, this job turns off typst-kit's font
          # feature, which rebuilds the Typst crates (~5 min on Windows, where
          # it was the critical path); it also lacks the CLI's `pdf-ops`.
          # Windows keeps its own ~1 GB entry; the other legs restore Test's
          # and save nothing, to stay within the 10 GB cap.
          shared-key: ${{ runner.os == 'Windows' && 'no-embedded-fonts-ci-profile' || 'test-ci-profile' }}
          save-if: ${{ github.ref == 'refs/heads/main' && runner.os == 'Windows' }}
      - name: Test native conversion without Typst fonts
        run: |
          cargo test --locked -p office2pdf --no-default-features --profile ci --lib font_feature
          cargo test --locked -p office2pdf --no-default-features --profile ci --test font_features

  no-embedded-fonts-cli:
    # Split from the job above, where it added 84s to macOS, the critical path.
    name: Check CLI without Typst fonts
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Reuses what it can of Test's entry (a check shares host build
          # scripts and proc macros, not rlibs) and saves nothing, so the
          # 10 GB cache budget is unchanged.
          shared-key: test-ci-profile
          save-if: false
      # Checked, not built: a ci-profile build of the CLI recompiled
      # dependencies at opt-level 2 for 4-6 min on Linux and macOS. A check
      # does no codegen, so opt-level does not matter; `--profile ci` only
      # selects target/ci, the directory the restored cache fills.
      - run: cargo check --locked -p office2pdf-cli --no-default-features --profile ci

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  wasm-check:
    # One leg per browser feature: the two package builds share nothing but
    # dependencies, so running them side by side halves the job.
    name: WASM Check & Test (${{ matrix.feature }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature: [wasm, wasm-cjk-font]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # wasm-cjk-font adds no dependency over wasm, so both legs share one
          # ~1.5 GB entry and only one leg saves it.
          shared-key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.feature == 'wasm' }}
      - name: Check wasm32 feature combinations
        if: matrix.feature == 'wasm'
        run: |
          cargo check --locked --target wasm32-unknown-unknown -p office2pdf
          cargo check --locked --target wasm32-unknown-unknown -p office2pdf --features wasm
          cargo check --locked --target wasm32-unknown-unknown -p office2pdf --no-default-features --features wasm
      - name: Check wasm32 with bundled Chinese font
        if: matrix.feature == 'wasm-cjk-font'
        run: cargo check --locked --target wasm32-unknown-unknown -p office2pdf --features wasm-cjk-font
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # `cargo check` and `wasm-pack test` do not link the browser package
      # documented in README.md, so keep that artifact buildable too.
      # `--no-opt` skips wasm-opt, which took ~7 of every 8 minutes here; this
      # job proves the package links, and no workflow publishes it.
      - name: Build browser package
        run: wasm-pack build crates/office2pdf --target web --no-opt --features ${{ matrix.feature }} --locked
      # Runs the wasm integration tests in src/wasm.rs under Node, exercising
      # the wasm32 time paths (Instant/SystemTime) end-to-end so the issue #178
      # class of runtime panic cannot regress unnoticed.
      - name: Run wasm tests in Node
        working-directory: crates/office2pdf
        run: wasm-pack test --node --features ${{ matrix.feature }} --locked

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  bulk-test:
    name: Bulk Third-Party Fixture Test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bulk-fixtures
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compare fixture outcomes with baseline
        run: cargo test --locked --release -p office2pdf --test bulk_conversion test_bulk_regression_gate -- --ignored --nocapture --exact
        env:
          BULK_REPORT_DIR: ${{ runner.temp }}/bulk-conversion
      - name: Upload bulk conversion reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulk-conversion-report
          path: ${{ runner.temp }}/bulk-conversion
          if-no-files-found: warn
